name: eval
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python eval/generate_gold.py --n 60 --seed 42
      - run: pytest -q
      # Regressions-Gate gegen echtes Modell erst aktivieren, wenn baseline.json existiert:
      # - run: python eval/run_eval.py --model <modell>
      #   env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
