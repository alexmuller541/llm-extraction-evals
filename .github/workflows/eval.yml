name: eval
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python eval/generate_gold.py --n 80 --seed 42
      - run: pytest -q
      # Offline-Gate: die regelbasierte Baseline darf sich nicht verschlechtern
      - run: python eval/run_eval.py --adapter regex_baseline
      # Live-Gate gegen die echte Pipeline (kostet API-Guthaben) – erst aktivieren, wenn
      # eval/baselines/origin_ab_parser.json existiert und die Pipeline im CI erreichbar ist.
